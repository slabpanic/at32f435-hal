[package]
name = "at32f435cgt7-examples"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false

[features]
default = ["time-driver-systick"]
time-driver-systick = ["at32f435-hal/time-driver-systick"]
time-driver-tim2 = ["at32f435-hal/time-driver-tim2"]

[[bin]]
name = "timer_pwm"
required-features = ["time-driver-systick"]

[[bin]]
name = "timer_advanced"
required-features = ["time-driver-systick"]

[dependencies]
at32f435-hal = { path = "../..", default-features = false, features = ["embassy", "exti", "defmt", "usb"] }
cortex-m-rt = "0.7"
embedded-hal = "1.0"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5", features = ["generic-queue-64"] }
embassy-usb = "0.6"
embassy-futures = "0.1.2"
static_cell = "2"
defmt = "1.0.1"
defmt-rtt = "1.3.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
